  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c1a30">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <title>Magic English Quest - 奇趣英语探险岛</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&amp;family=Nunito:wght@600;800;900&amp;display=swap" rel="stylesheet">
  <!-- Lucide Icons & React / Babel for live interactive SPA -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Fredoka', 'Nunito', system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0c1a30;
      overflow: hidden;
    }
    /* 16:9 Landscape App Container for Android Tablet */
    .tablet-viewport {
      width: 100vw;
      height: 100vh !important;
      height: 100dvh !important;
      min-height: 0 !important;
      max-aspect-ratio: 16/9;
      margin: 0 auto;
      position: relative;
      overflow: hidden !important;
      padding-bottom: 0 !important;
      box-shadow: 0 0 50px rgba(0,0,0,0.6);
    }
    @media (min-aspect-ratio: 16/9) {
      .tablet-viewport {
        height: 100vh;
        width: calc(100vh * 16 / 9);
      }
    }
    @media (max-aspect-ratio: 16/9) {
      .tablet-viewport {
        width: 100vw;
        height: calc(100vw * 9 / 16);
      }
    }

    /* Cartoon 3D Game UI Buttons */
    .game-btn {
      transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .game-btn:active {
      transform: translateY(4px);
    }
    .btn-green {
      background: linear-gradient(180deg, #58CC02 0%, #46A302 100%);
      box-shadow: 0 6px 0 #327501, 0 10px 15px rgba(0,0,0,0.25);
    }
    .btn-green:active {
      box-shadow: 0 2px 0 #327501, 0 4px 6px rgba(0,0,0,0.2);
    }
    .btn-blue {
      background: linear-gradient(180deg, #1CB0F6 0%, #1899D6 100%);
      box-shadow: 0 6px 0 #1272A0, 0 10px 15px rgba(0,0,0,0.25);
    }
    .btn-yellow {
      background: linear-gradient(180deg, #FFC800 0%, #FFA800 100%);
      box-shadow: 0 6px 0 #B87800, 0 10px 15px rgba(0,0,0,0.25);
    }
    .btn-purple {
      background: linear-gradient(180deg, #CE82FF 0%, #A855F7 100%);
      box-shadow: 0 6px 0 #7E22CE, 0 10px 15px rgba(0,0,0,0.25);
    }
    .btn-coral {
      background: linear-gradient(180deg, #FF6B6B 0%, #EE5253 100%);
      box-shadow: 0 6px 0 #B33939, 0 10px 15px rgba(0,0,0,0.25);
    }

    /* Soft Animated Floating */
    @keyframes floaty {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    .animate-float {
      animation: floaty 4s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .ring-glow {
      animation: pulse-ring 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-error {
      animation: gentle-shake 0.4s ease-in-out;
    }
    /* Cloud backdrop movement */
    @keyframes drift {
      from { transform: translateX(-10%); }
      to { transform: translateX(10%); }
    }
    .cloud-drift {
      animation: drift 25s ease-in-out infinite alternate;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #4ade80;
      border-radius: 999px;
    }

    /* The reference export used a fixed 1024px artboard. Keep its exact
       visual hierarchy while allowing every screen to occupy the tablet. */
    .tablet-viewport > div {
      min-height: 0;
    }
    .tablet-viewport [data-stitch-vh] {
      height: 100% !important;
      min-height: 0;
    }
    @media (orientation: portrait) {
      body::before {
        content: "请将平板旋转至横屏";
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: white;
        background: #0c1a30;
        font-size: 1.25rem;
        font-weight: 800;
      }

</head>
<body class="flex items-center justify-center min-h-screen bg-slate-950 p-0 m-0" style="background-color: rgb(12, 26, 48); overflow: auto; min-height: 100vh;">
  <div id="root" class="tablet-viewport bg-gradient-to-b from-[#38bdf8] via-[#60a5fa] to-[#93c5fd]"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- SOUND ENGINE (Web Audio API Synthesizer) ---
    const soundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      play(type) {
        try {
          this.init();
          if (!this.ctx) return;
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'correct') {
            // Cheerful chime: C5 -> G5 -> C6
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, t);
            osc.frequency.setValueAtTime(659.25, t + 0.08);
            osc.frequency.setValueAtTime(783.99, t + 0.16);
            osc.frequency.setValueAtTime(1046.50, t + 0.24);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
            osc.start(t);
            osc.stop(t + 0.55);
          } else if (type === 'wrong') {
            // Gentle low bonk
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(240, t);
            osc.frequency.exponentialRampToValueAtTime(120, t + 0.25);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.start(t);
            osc.stop(t + 0.3);
          } else if (type === 'pop') {
            // Soft bubble pop
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.exponentialRampToValueAtTime(900, t + 0.06);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
            osc.start(t);
            osc.stop(t + 0.07);
          } else if (type === 'fanfare') {
            // Victory celebration
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.connect(g);
              g.connect(this.ctx.destination);
              o.type = 'triangle';
              o.frequency.setValueAtTime(freq, t + idx * 0.12);
              g.gain.setValueAtTime(0.25, t + idx * 0.12);
              g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.12 + 0.4);
              o.start(t + idx * 0.12);
              o.stop(t + idx * 0.12 + 0.45);
            });
          } else if (type === 'boss_hit') {
            // Heavy impact
            osc.type = 'square';
            osc.frequency.setValueAtTime(180, t);
            osc.frequency.exponentialRampToValueAtTime(45, t + 0.3);
            gain.gain.setValueAtTime(0.35, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.start(t);
            osc.stop(t + 0.35);
          }
        } catch (e) {
          console.warn("Sound play suppressed", e);
        }
      }
    };

    // --- TTS SPEECH SYNTHESIS HELPER ---
    const speakEnglish = (text) => {
      soundEngine.play('pop');
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // Slightly slower for primary school students
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    };

    // --- CURRICULUM CONFIGURATION (PEP 5th Grade Unit 1: My Day / Daily Life) ---
    const CURRICULUM_DATA = {
      unitId: "pep_g5_u1",
      unitTitle: "Unit 1: My Wonderful Day",
      unitSubtitle: "人教版五年级下册 · 每日作息与探险活动",
      words: [
        { id: "w1", word: "breakfast", phonetic: "[ˈbrekfəst]", meaning: "早餐；早饭", example: "I have delicious breakfast at 7:00 a.m.", category: "daily" },
        { id: "w2", word: "weekend", phonetic: "[ˈwiːkend]", meaning: "周末", example: "We go hiking on the sunny weekend.", category: "time" },
        { id: "w3", word: "clean", phonetic: "[kliːn]", meaning: "打扫；干净的", example: "Tim and Lily clean my room together.", category: "action" },
        { id: "w4", word: "exercise", phonetic: "[ˈeksəsaɪz]", meaning: "活动；做运动", example: "Students do morning exercise on the playground.", category: "action" },
        { id: "w5", word: "always", phonetic: "[ˈɔːlweɪz]", meaning: "总是；一直", example: "The sun always rises in the east.", category: "frequency" },
        { id: "w6", word: "usually", phonetic: "[ˈjuːʒuəli]", meaning: "通常；经常", example: "I usually walk to school with my dog.", category: "frequency" },
        { id: "w7", word: "often", phonetic: "[ˈɒfn]", meaning: "常常；时常", example: "Do you often play football after class?", category: "frequency" },
        { id: "w8", word: "sometimes", phonetic: "[ˈsʌmtaɪmz]", meaning: "有时；间或", example: "Sometimes I read fantasy books at night.", category: "frequency" },
        { id: "w9", word: "dancing", phonetic: "[ˈdɑːnsɪŋ]", meaning: "跳舞；舞蹈", example: "She takes dancing class every Saturday.", category: "hobby" },
        { id: "w10", word: "shopping", phonetic: "[ˈʃɒpɪŋ]", meaning: "购物；买东西", example: "Mom and I go shopping in the supermarket.", category: "action" }
      ],
      grammarPoints: [
        {
          id: "g1",
          title: "一般现在时第三人称单数 (三单变形)",
          tag: "时态与主谓一致",
          scenarios: [
            { text: "I clean my room every Sunday.", speaker: "Amy (我)" },
            { text: "My brother cleans his room every Sunday.", speaker: "Tom (他 - 三单加s)" }
          ],
          discoveryQuestion: "仔细看上面两个句子，为什么第二个句子 clean 后面加了 's' 呢？",
          options: [
            { text: "因为 brother 是单数第三人称(他)，动词要变三单加s！", isCorrect: true },
            { text: "因为星期天必须在词尾加s", isCorrect: false },
            { text: "只是打印打错了，其实完全一样", isCorrect: false }
          ],
          ruleCard: {
            formula: "主语(he/she/it/单个人名) + 动词-(e)s + 其他",
            mnemonic: "「三单一来动词急，词尾带上小尾巴(s/es)；若是I/You/复数来，动词原形乐开怀！」",
            note: "以o, s, x, ch, sh结尾动词加-es (如: goes, watches, washes)"
          },
          practice: {
            type: "correction",
            question: "找出并改错：Lily usually go to school at 7:30.",
            sentenceParts: ["Lily usually ", "go", " to school at 7:30."],
            correctWord: "goes",
            wrongWord: "go",
            explanation: "Lily 是单个人名(第三人称单数)，go 必须变身为 goes！"
          }
        },
        {
          id: "g2",
          title: "现在进行时 (正在发生的事情)",
          tag: "进行时态 be + doing",
          scenarios: [
            { text: "Look! The monkey is climbing the tree right now!", speaker: "自然向导" },
            { text: "Listen! Children are singing an English song.", speaker: "音乐教室" }
          ],
          discoveryQuestion: "看到 Look! / Listen! 或 right now 时，句子里都出现了什么共同特征？",
          options: [
            { text: "都有 be动词(is/are) + 动词-ing (正在做)", isCorrect: true },
            { text: "句子结尾都必须有一个问号", isCorrect: false },
            { text: "动词都用过去式加 ed", isCorrect: false }
          ],
          ruleCard: {
            formula: "主语 + am / is / are + 动词-ing",
            mnemonic: "「进行时态双胞胎，be动词+ing不能拆！缺了be动词不像样，漏了ing没希望！」",
            note: "表示'此刻正在进行'，标志词：now, look, listen, right now"
          },
          practice: {
            type: "completion",
            question: "选词填空：Look! Sarah and John ______ (eat) breakfast together.",
            options: ["is eating", "are eating", "eats", "eat"],
            correctAnswer: "are eating",
            explanation: "Sarah and John 是两个人(复数)，be动词用 are，加上动词-ing 构成 are eating！"
          }
        }
      ]
    };

    // --- LOCAL STORAGE DATA SERVICE ---
    const STORAGE_KEY = "MAGIC_ENGLISH_STUDENT_STATE_V1";

    const getDefaultState = () => ({
      studentName: "Lucas",
      level: 5,
      stars: 42,
      coins: 380,
      totalStudyMinutes: 48,
      todayStudyMinutes: 18,
      currentIslandId: 1,
      unlockedNodes: ["node_1", "node_2", "node_3", "node_4"],
      nodeStars: { "node_1": 3, "node_2": 2 },
      // Word Mastery records
      wordsProgress: {
        "w1": { errorCount: 1, errorLetters: { 'a': 1 }, mastered: true, reviewInterval: 3, nextReviewAt: Date.now() - 3600000 },
        "w2": { errorCount: 3, errorLetters: { 'e': 2, 'k': 1 }, mastered: false, reviewInterval: 1, nextReviewAt: Date.now() - 7200000 },
        "w3": { errorCount: 0, errorLetters: {}, mastered: true, reviewInterval: 7, nextReviewAt: Date.now() + 86400000 },
        "w4": { errorCount: 4, errorLetters: { 'c': 3, 's': 1 }, mastered: false, reviewInterval: 1, nextReviewAt: Date.now() - 1000 },
        "w5": { errorCount: 0, errorLetters: {}, mastered: true, reviewInterval: 15, nextReviewAt: Date.now() + 172800000 }
      },
      // Grammar accuracy
      grammarProgress: {
        "g1": { attempted: 8, correct: 6 },
        "g2": { attempted: 5, correct: 4 }
      },
      // Daily history
      historyGrowth: [
        { day: "周一", words: 8, minutes: 15 },
        { day: "周二", words: 14, minutes: 20 },
        { day: "周三", words: 22, minutes: 25 },
        { day: "周四", words: 29, minutes: 18 },
        { day: "周五", words: 35, minutes: 22 },
        { day: "周六", words: 44, minutes: 30 },
        { day: "今日", words: 52, minutes: 18 }
      ]
    });

    const useStudentStore = () => {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : getDefaultState();
        } catch (e) {
          return getDefaultState();
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          console.error("Save error", e);
        }
      }, [state]);

      const recordWordError = (wordId, char, pos) => {
        setState(prev => {
          const w = prev.wordsProgress[wordId] || { errorCount: 0, errorLetters: {}, mastered: false, reviewInterval: 1, nextReviewAt: Date.now() };
          const newErrors = { ...w.errorLetters, [char]: (w.errorLetters[char] || 0) + 1 };
          return {
            ...prev,
            wordsProgress: {
              ...prev.wordsProgress,
              [wordId]: {
                ...w,
                errorCount: w.errorCount + 1,
                errorLetters: newErrors,
                mastered: false,
                reviewInterval: 1,
                nextReviewAt: Date.now() + 86400000 // 1 day interval
              }
            }
          };
        });
      };

      const recordWordMastered = (wordId) => {
        setState(prev => {
          const w = prev.wordsProgress[wordId] || { errorCount: 0, errorLetters: {}, mastered: false, reviewInterval: 1, nextReviewAt: Date.now() };
          return {
            ...prev,
            stars: prev.stars + 1,
            coins: prev.coins + 10,
            wordsProgress: {
              ...prev.wordsProgress,
              [wordId]: {
                ...w,
                mastered: true,
                reviewInterval: (w.reviewInterval || 1) * 2,
                nextReviewAt: Date.now() + (w.reviewInterval || 1) * 86400000
              }
            }
          };
        });
      };

      const recordGrammarAnswer = (grammarId, isCorrect) => {
        setState(prev => {
          const g = prev.grammarProgress[grammarId] || { attempted: 0, correct: 0 };
          return {
            ...prev,
            stars: isCorrect ? prev.stars + 2 : prev.stars,
            grammarProgress: {
              ...prev.grammarProgress,
              [grammarId]: {
                attempted: g.attempted + 1,
                correct: isCorrect ? g.correct + 1 : g.correct
              }
            }
          };
        });
      };

      const unlockNextNode = (nodeId, earnedStars = 3) => {
        setState(prev => {
          const updatedStars = { ...prev.nodeStars, [nodeId]: Math.max(earnedStars, prev.nodeStars[nodeId] || 0) };
          return {
            ...prev,
            stars: prev.stars + earnedStars,
            coins: prev.coins + 25,
            nodeStars: updatedStars
          };
        });
      };

      return {
        state,
        recordWordError,
        recordWordMastered,
        recordGrammarAnswer,
        unlockNextNode
      };
    };

    // =========================================================================
    // HEADER COMPONENT (Global Tablet HUD)
    // =========================================================================
    const AppHeader = ({ state, currentTab, setTab, onBackToMap }) => {
      return (
        <header class="h-16 px-6 bg-slate-900/80 backdrop-blur border-b-4 border-amber-400/40 flex items-center justify-between text-white z-40 relative">
          <div class="flex items-center gap-3">
            {currentTab !== 'map' && (
              <button 
                onClick={onBackToMap}
                class="game-btn px-4 py-2 rounded-2xl bg-amber-500 hover:bg-amber-400 text-amber-950 font-black text-sm flex items-center gap-1.5 border-b-4 border-amber-700 shadow-md"
              >
                <span>🗺️</span>
                <span>返回地图</span>
              </button>
            )}
            
            <div class="flex items-center gap-2 bg-slate-800/80 px-3.5 py-1.5 rounded-2xl border border-slate-700">
              <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-orange-400 flex items-center justify-center font-bold text-amber-950 shadow-inner">
                5上
              </div>
              <div>
                <div class="text-xs text-amber-300 font-bold leading-tight">Unit 1 探险中</div>
                <div class="text-sm font-extrabold tracking-wide text-slate-100">My Wonderful Day</div>
              </div>
            </div>
          </div>

          {/* Stats Bar */}
          <div class="flex items-center gap-5">
            {/* Stars */}
            <div class="flex items-center gap-1.5 bg-amber-500/20 px-3 py-1.5 rounded-2xl border border-amber-400/50">
              <span class="text-xl animate-bounce">⭐</span>
              <span class="text-lg font-black text-amber-300 tracking-wide">{state.stars}</span>
            </div>

            {/* Coins */}
            <div class="flex items-center gap-1.5 bg-yellow-500/20 px-3 py-1.5 rounded-2xl border border-yellow-400/50">
              <span class="text-xl">🪙</span>
              <span class="text-lg font-black text-yellow-300">{state.coins}</span>
            </div>

            {/* Parent Center Tab Toggle */}
            <button 
              onClick={() => setTab(currentTab === 'parent' ? 'map' : 'parent')}
              class={`game-btn px-4 py-2 rounded-2xl font-black text-sm flex items-center gap-2 border-b-4 transition-all ${
                currentTab === 'parent' 
                  ? 'bg-purple-600 border-purple-900 text-white shadow-lg' 
                  : 'bg-slate-700 border-slate-900 text-slate-200 hover:bg-slate-600'
              }`}
            >
              <span>📊</span>
              <span>{currentTab === 'parent' ? '返回闯关' : '家长学情报告'}</span>
            </button>
          </div>
        </header>
      );
    };

    // =========================================================================
    // 1. ADVENTURE MAP VIEW (闯关地图 & 核心玩法)
    // =========================================================================
    const MapView = ({ state, onSelectNode }) => {
      const nodes = [
        {
          id: "node_1",
          type: "learning",
          title: "新词启航营",
          desc: "5步多通道记忆法",
          icon: "🌱",
          pos: { top: "62%", left: "14%" },
          theme: "from-emerald-400 to-green-600",
          ring: "border-green-400"
        },
        {
          id: "node_2",
          type: "spelling",
          title: "键盘拼写营",
          desc: "实体按键逐字打怪",
          icon: "⌨️",
          pos: { top: "34%", left: "37%" },
          theme: "from-sky-400 to-blue-600",
          ring: "border-sky-400"
        },
        {
          id: "node_3",
          type: "grammar",
          title: "语法思考工坊",
          desc: "先观察情境后解谜",
          icon: "💡",
          pos: { top: "60%", left: "62%" },
          theme: "from-violet-400 to-purple-600",
          ring: "border-purple-400"
        },
        {
          id: "node_4",
          type: "boss",
          title: "时空遗忘兽 Boss",
          desc: "遗忘曲线艾宾浩斯挑战",
          icon: "🐉",
          pos: { top: "28%", left: "84%" },
          theme: "from-rose-500 to-red-700",

    // =========================================================================
    // 2. WORD 5-STEP MULTI-CHANNEL LEARNING MODULE (5步多通道记忆关)
    // =========================================================================
    const WordLearningView = ({ words, onComplete, recordMastery }) => {
      const [step, setStep] = useState(1); // 1: 认读+听音; 2: 语境例句; 3: 听音辨义; 4: 看中选英; 5: 实体拼写
      const [currentIndex, setCurrentIndex] = useState(0);
      const currentWord = words[currentIndex] || words[0];

      // Quiz step states
      const [feedback, setFeedback] = useState(null); // 'correct' | 'wrong' | null
      const [quizOptions, setQuizOptions] = useState([]);

      // Setup random options for step 3 & 4
      useEffect(() => {
        if (step === 3) {
          // Listen audio -> select Chinese meaning
          const wrongPool = words.filter(w => w.id !== currentWord.id).map(w => w.meaning);
          const shuffled = [currentWord.meaning, ...wrongPool.slice(0, 3)].sort(() => Math.random() - 0.5);
          setQuizOptions(shuffled);
          speakEnglish(currentWord.word);
        } else if (step === 4) {
          // Look Chinese -> select English word
          const wrongPool = words.filter(w => w.id !== currentWord.id).map(w => w.word);
          const shuffled = [currentWord.word, ...wrongPool.slice(0, 3)].sort(() => Math.random() - 0.5);
          setQuizOptions(shuffled);
        } else if (step === 1 || step === 2) {
          speakEnglish(currentWord.word);
        }
        setFeedback(null);
      }, [step, currentIndex]);

      const handleOptionClick = (opt) => {
        if (step === 3) {
          if (opt === currentWord.meaning) {
            soundEngine.play('correct');
            setFeedback('correct');
            setTimeout(() => setStep(4), 900);
          } else {
            soundEngine.play('wrong');
            setFeedback('wrong');
          }
        } else if (step === 4) {
          if (opt === currentWord.word) {
            soundEngine.play('correct');
            setFeedback('correct');
            setTimeout(() => setStep(5), 900);
          } else {
            soundEngine.play('wrong');
            setFeedback('wrong');
          }
        }
      };

      const handleStep5Finished = () => {
        recordMastery(currentWord.id);
        if (currentIndex < words.length - 1) {
          setCurrentIndex(c => c + 1);
          setStep(1);
        } else {
          soundEngine.play('fanfare');
          window.confetti && window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          onComplete();
        }
      };

      return (
        <div class="h-[calc(1024px-4rem)] p-6 bg-slate-900 flex flex-col items-center justify-between text-white" data-stitch-vh="h-[calc(1024px-4rem)]===h-[calc(100vh-4rem)]">
          {/* Top Progress & Stepper */}
          <div class="w-full max-w-4xl flex items-center justify-between bg-slate-800/80 px-6 py-3 rounded-2xl border border-slate-700">
            <div class="flex items-center gap-2 font-bold text-amber-400">
              <span>📖 单词探索 {currentIndex + 1} / {words.length}</span>
            </div>

            {/* 5-step Pills */}
            <div class="flex items-center gap-2">
              {[
                { s: 1, label: "1. 词形发音" },
                { s: 2, label: "2. 语境探秘" },
                { s: 3, label: "3. 听音辨义" },
                { s: 4, label: "4. 看义识词" },
                { s: 5, label: "5. 拼写闯关" }
              ].map(item => (
                <div 
                  key={item.s}
                  class={`px-3 py-1 rounded-full text-xs font-black transition-all ${
                    step === item.s 
                      ? 'bg-amber-400 text-slate-950 scale-105 shadow-md ring-2 ring-amber-300' 
                      : step > item.s 
                        ? 'bg-emerald-600 text-white' 
                        : 'bg-slate-700 text-slate-400'
                  }`}
                >
                  {item.label}
                </div>
              ))}
            </div>
          </div>

          {/* Main Card Container */}
          <div class="w-full max-w-3xl flex-1 flex items-center justify-center my-4">
            
            {/* Step 1: Word Form + Phonetic + Translation */}
            {step === 1 && (
              <div class="w-full bg-slate-800 border-4 border-amber-400/50 rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center animate-float">
                <div class="inline-block px-4 py-1 rounded-full bg-amber-400/20 text-amber-300 text-sm font-black mb-3">
                  Step 1 · 看词形 & 听纯正发音
                </div>
                
                <h1 class="text-6xl font-black tracking-wider text-amber-300 mb-2">
                  {currentWord.word}
                </h1>
                
                <div class="text-2xl text-slate-400 font-mono mb-4 flex items-center gap-3">
                  <span>{currentWord.phonetic}</span>
                  <button 
                    onClick={() => speakEnglish(currentWord.word)}
                    class="p-2.5 rounded-full bg-sky-500 hover:bg-sky-400 text-white shadow-lg active:scale-90 transition-transform"
                    title="点击朗读"
                  >
                    🔊
                  </button>
                </div>

                <div class="text-3xl font-extrabold text-emerald-400 bg-slate-900/70 px-8 py-3 rounded-2xl border border-emerald-500/30 mb-8">
                  {currentWord.meaning}
                </div>

                <button 
                  onClick={() => setStep(2)}
                  class="game-btn btn-green px-10 py-3.5 rounded-2xl font-black text-xl text-white tracking-wider"
                >
                  进入语境例句 ➜
                </button>
              </div>
            )}

            {/* Step 2: Contextual Example Sentence */}
            {step === 2 && (
              <div class="w-full bg-slate-800 border-4 border-sky-400/50 rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center">
                <div class="inline-block px-4 py-1 rounded-full bg-sky-400/20 text-sky-300 text-sm font-black mb-3">
                  Step 2 · 贴近小学生生活的真实情境例句
                </div>

                <div class="text-4xl font-black text-amber-300 mb-4">{currentWord.word}</div>

                <div class="bg-slate-900/90 p-6 rounded-2xl border-2 border-sky-500/40 w-full mb-6 relative">
                  <p class="text-2xl font-bold text-slate-100 mb-3 leading-relaxed">
                    "{currentWord.example}"
                  </p>
                  <button 
                    onClick={() => speakEnglish(currentWord.example)}
                    class="game-btn px-4 py-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm inline-flex items-center gap-2"
                  >
                    <span>🔊 慢速朗读整句</span>
                  </button>
                </div>

                <button 
                  onClick={() => setStep(3)}
                  class="game-btn btn-blue px-10 py-3.5 rounded-2xl font-black text-xl text-white"
                >
                  开始听音选义挑战 ➜
                </button>
              </div>
            )}

            {/* Step 3: Listen & Pick Chinese meaning */}
            {step === 3 && (
              <div class="w-full bg-slate-800 border-4 border-purple-400/50 rounded-3xl p-8 shadow-2xl flex flex-col items-center">
                <div class="text-xs font-black text-purple-300 bg-purple-500/20 px-4 py-1 rounded-full mb-3">
                  Step 3 · 听音选义
                </div>

                <div class="flex items-center gap-4 mb-6">
                  <button 
                    onClick={() => speakEnglish(currentWord.word)}
                    class="game-btn p-5 rounded-full bg-purple-500 hover:bg-purple-400 text-3xl shadow-xl animate-bounce"
                  >
                    🔊
                  </button>
                  <div class="text-xl font-bold text-slate-300">点击喇叭仔细听，选出正确的中文释义：</div>
                </div>

                <div class="grid grid-cols-2 gap-4 w-full">
                  {quizOptions.map((opt, idx) => (
                    <button
                      key={idx}
                      onClick={() => handleOptionClick(opt)}
                      class="game-btn p-5 rounded-2xl bg-slate-700/80 hover:bg-slate-700 border-2 border-slate-600 hover:border-purple-400 text-xl font-extrabold text-white text-center transition-all"
                    >
                      {opt}
                    </button>
                  ))}
                </div>

                {feedback === 'wrong' && (
                  <div class="mt-4 text-rose-400 font-bold shake-error">
                    再仔细听一次发音哦，不要灰心！💪
                  </div>
                )}
              </div>
            )}

            {/* Step 4: Look Chinese & Pick English word */}
            {step === 4 && (
              <div class="w-full bg-slate-800 border-4 border-yellow-400/50 rounded-3xl p-8 shadow-2xl flex flex-col items-center">
                <div class="text-xs font-black text-yellow-300 bg-yellow-500/20 px-4 py-1 rounded-full mb-3">
                  Step 4 · 看义选词
                </div>

                <div class="text-3xl font-black text-yellow-300 mb-6 bg-slate-900/80 px-8 py-3 rounded-2xl border border-yellow-500/30">
                  {currentWord.meaning}
                </div>

                <div class="grid grid-cols-2 gap-4 w-full">
                  {quizOptions.map((opt, idx) => (
                    <button
                      key={idx}
                      onClick={() => handleOptionClick(opt)}
                      class="game-btn p-5 rounded-2xl bg-slate-700/80 hover:bg-slate-700 border-2 border-slate-600 hover:border-yellow-400 text-2xl font-black text-white text-center transition-all"
                    >
                      {opt}
                    </button>
                  ))}
                </div>

                {feedback === 'wrong' && (
                  <div class="mt-4 text-rose-400 font-bold shake-error">
                    提示：可以想想刚才学过的词根或读音哦！
                  </div>
                )}
              </div>
            )}

            {/* Step 5: Keyboard Spelling Mini-Game */}
            {step === 5 && (
              <div class="w-full">
                <SpellingLevelComponent 
                  wordObj={currentWord}
                  onFinished={handleStep5Finished}
                  embedded={true}
                />
              </div>
            )}

          </div>

          {/* Bottom Hint */}
          <div class="text-slate-500 text-xs font-bold">
            提示：支持触摸屏与外接键盘，答错不惩罚，随时点击喇叭听发音
          </div>
        </div>
      );
    };

    // =========================================================================
    // 3. PHYSICAL KEYBOARD SPELLING COMPONENT (键盘拼写关卡)
    // =========================================================================
    const SpellingLevelComponent = ({ wordObj, onFinished, embedded = false }) => {
      const targetWord = wordObj.word.toLowerCase();
      const [inputChars, setInputChars] = useState([]);
      const [wrongAttemptChar, setWrongAttemptChar] = useState(null);
      const [shakeWrong, setShakeWrong] = useState(false);
      const [hintNext, setHintNext] = useState(false);

      const nextTargetChar = targetWord[inputChars.length] || "";

      // Physical Keyboard Listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Backspace') {
            soundEngine.play('pop');
            setInputChars(prev => prev.slice(0, -1));
            setWrongAttemptChar(null);
            return;
          }
          if (/^[a-zA-Z]$/.test(e.key)) {
            handleCharInput(e.key.toLowerCase());
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [inputChars, targetWord]);

      const handleCharInput = (char) => {
        if (inputChars.length >= targetWord.length) return;

        const expectedChar = targetWord[inputChars.length];
        if (char === expectedChar) {
          soundEngine.play('correct');
          const nextState = [...inputChars, char];
          setInputChars(nextState);
          setWrongAttemptChar(null);
          setHintNext(false);

          // Check word complete
          if (nextState.length === targetWord.length) {
            soundEngine.play('fanfare');
            speakEnglish(targetWord);
            setTimeout(() => {
              onFinished && onFinished();
            }, 1000);
          }
        } else {
          // Mistake!
          soundEngine.play('wrong');
          setWrongAttemptChar(char);
          setShakeWrong(true);
          setTimeout(() => setShakeWrong(false), 500);
        }
      };

      return (
        <div class={`w-full bg-slate-800 border-4 border-sky-400/50 rounded-3xl p-6 shadow-2xl flex flex-col items-center ${shakeWrong ? 'shake-error' : ''}`}>
          <div class="flex items-center justify-between w-full mb-3 px-4">
            <span class="text-xs font-black bg-sky-500/20 text-sky-300 px-3 py-1 rounded-full">
              ⌨️ 键盘拼写模式 (请直接敲击外接键盘 或 屏幕轻触)
            </span>
            <button 
              onClick={() => speakEnglish(targetWord)}
              class="text-xs font-bold text-sky-400 hover:text-sky-300 flex items-center gap-1 bg-slate-900/60 px-3 py-1 rounded-full"
            >
              <span>🔊 播放发音</span>
            </button>
          </div>

          {/* Meaning Prompt */}
          <div class="text-2xl font-extrabold text-amber-300 mb-2">{wordObj.meaning}</div>
          <div class="text-sm text-slate-400 font-mono mb-4">{wordObj.phonetic}</div>

          {/* Letter Slots */}
          <div class="flex gap-2.5 justify-center my-4 flex-wrap">
            {targetWord.split('').map((char, index) => {
              const entered = inputChars[index];
              const isCurrent = index === inputChars.length;
              return (
                <div 
                  key={index}
                  class={`w-14 h-16 rounded-2xl flex items-center justify-center font-black text-3xl transition-all border-b-4 ${
                    entered 
                      ? 'bg-emerald-500 border-emerald-700 text-white shadow-lg scale-105' 
                      : isCurrent 
                        ? 'bg-slate-700 border-sky-400 text-sky-300 animate-pulse ring-2 ring-sky-400' 
                        : 'bg-slate-700/60 border-slate-900 text-transparent'
                  }`}
                >
                  {entered ? entered.toUpperCase() : (hintNext && isCurrent ? char.toUpperCase() : "_")}
                </div>
              );
            })}
          </div>

          {/* Error & Next Letter Hint Bar */}
          <div class="h-8 flex items-center justify-center mb-2">
            {wrongAttemptChar && (
              <div class="text-rose-400 font-extrabold text-sm flex items-center gap-2">
                <span>❌ 刚才按了 "{wrongAttemptChar.toUpperCase()}" 错了哦！</span>
                <button 
                  onClick={() => setHintNext(true)}
                  class="underline text-amber-300 hover:text-amber-200"
                >
                  偷看下一个字母？
                </button>
              </div>
            )}
            {inputChars.length === targetWord.length && (
              <div class="text-emerald-400 font-black text-lg flex items-center gap-2 animate-bounce">
                🎉 拼写完全正确！Awesome!
              </div>
            )}
          </div>

          {/* On-Screen Virtual Keyboard for touch tablet use */}
          <div class="w-full max-w-xl bg-slate-900/80 p-3 rounded-2xl border border-slate-700 mt-2">
            {["qwertyuiop", "asdfghjkl", "zxcvbnm"].map((row, rIdx) => (
              <div key={rIdx} class="flex justify-center gap-1.5 my-1">
                {row.split('').map(letter => (
                  <button
                    key={letter}
                    onClick={() => handleCharInput(letter)}
                    class="game-btn w-9 h-11 rounded-lg bg-slate-700 hover:bg-slate-600 border-b-2 border-slate-900 text-slate-100 font-bold text-lg flex items-center justify-center active:bg-sky-600"
                  >
                    {letter.toUpperCase()}
                  </button>
                ))}
                {rIdx === 2 && (
                  <button
                    onClick={() => {
                      soundEngine.play('pop');
                      setInputChars(prev => prev.slice(0, -1));
                    }}
                    class="game-btn px-3 h-11 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs flex items-center justify-center border-b-2 border-rose-900"
                  >
                    退格 ⌫
                  </button>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    };

    // =========================================================================
    // 4. GRAMMAR MODULE (先思考、后讲解、主动输出)
    // =========================================================================
    const GrammarView = ({ grammarPoints, onComplete, recordGrammar }) => {
      const [currentGIndex, setCurrentGIndex] = useState(0);
      const [phase, setPhase] = useState(1); // 1: 情境例句+引导发现; 2: 规则揭示卡; 3: 主动输出题
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);
      const [userOutputAnswer, setUserOutputAnswer] = useState(null);

      const currentG = grammarPoints[currentGIndex] || grammarPoints[0];

      const handleDiscoverySubmit = (opt) => {
        setSelectedChoice(opt);
        if (opt.isCorrect) {
          soundEngine.play('correct');
        } else {
          soundEngine.play('wrong');
        }
        setShowExplanation(true);
      };

      const handleOutputSubmit = (ans) => {
        setUserOutputAnswer(ans);
        const isCorrect = ans === (currentG.practice.correctAnswer || currentG.practice.correctWord);
        recordGrammar(currentG.id, isCorrect);
        if (isCorrect) {
          soundEngine.play('correct');
        } else {
          soundEngine.play('wrong');
        }
      };

      const handleNextGrammar = () => {
        if (currentGIndex < grammarPoints.length - 1) {
          setCurrentGIndex(c => c + 1);
          setPhase(1);
          setSelectedChoice(null);
          setShowExplanation(false);
          setUserOutputAnswer(null);
        } else {
          soundEngine.play('fanfare');
          window.confetti && window.confetti({ particleCount: 100, spread: 80 });
          onComplete();
        }
      };

      return (
        <div class="h-[calc(1024px-4rem)] p-6 bg-slate-900 flex flex-col items-center justify-between text-white" data-stitch-vh="h-[calc(1024px-4rem)]===h-[calc(100vh-4rem)]">
          {/* Header */}
          <div class="w-full max-w-4xl bg-slate-800/90 px-6 py-3 rounded-2xl border border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xl">💡</span>
              <span class="font-extrabold text-purple-300 text-lg">{currentG.title}</span>
              <span class="text-xs bg-purple-500/20 text-purple-200 px-2 py-0.5 rounded-md font-bold">
                {currentG.tag}
              </span>
            </div>

            <div class="flex gap-2 text-xs font-black">
              <span class={`px-3 py-1 rounded-full ${phase === 1 ? 'bg-amber-400 text-slate-950' : 'bg-slate-700 text-slate-400'}`}>

      // Review items priority queue
      const reviewQueue = useMemo(() => {
        return words.slice(0, 5); // 5 review questions
      }, [words]);

      const [qIndex, setQIndex] = useState(0);
      const [bossHp, setBossHp] = useState(100);
      const [playerHp, setPlayerHp] = useState(100);
      const [bossAction, setBossAction] = useState('idle'); // 'idle' | 'hit' | 'attack'
      const [playerFeedback, setPlayerFeedback] = useState(null);

      const currentQ = reviewQueue[qIndex] || reviewQueue[0];

      // Boss Battle Questions
      const options = useMemo(() => {
        const wrongs = words.filter(w => w.id !== currentQ.id).map(w => w.meaning);
        return [currentQ.meaning, ...wrongs.slice(0, 3)].sort(() => Math.random() - 0.5);
      }, [qIndex, currentQ]);

      const handleAnswer = (chosenMeaning) => {
        if (chosenMeaning === currentQ.meaning) {
          // Player attacks Boss!
          soundEngine.play('boss_hit');
          setBossAction('hit');
          setPlayerFeedback('correct');
          const newHp = Math.max(0, bossHp - 25);
          setBossHp(newHp);
          recordMastery(currentQ.id);

          setTimeout(() => {
            setBossAction('idle');
            setPlayerFeedback(null);
            if (newHp <= 0 || qIndex >= reviewQueue.length - 1) {
              soundEngine.play('fanfare');
              window.confetti && window.confetti({ particleCount: 150, spread: 90 });
              onVictory();
            } else {
              setQIndex(q => q + 1);
            }
          }, 800);
        } else {
          // Boss retaliates!
          soundEngine.play('wrong');
          setBossAction('attack');
          setPlayerFeedback('wrong');
          setPlayerHp(prev => Math.max(10, prev - 15));

          setTimeout(() => {
            setBossAction('idle');
            setPlayerFeedback(null);
          }, 800);
        }
      };

              </div>
              <div class="text-xs text-purple-300 mt-1">经历“观察-探秘-规则-实战”</div>
            </div>
          </div>

          {/* Detailed Diagnostic Grids */}
          <div class="grid grid-cols-2 gap-6">
            
            {/* Left: Vocabulary Growth Chart & Spelling Error Hotspot */}
            <div class="space-y-6">
              {/* Growth Curve */}
              <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <div class="text-base font-black text-slate-200 mb-3 flex items-center justify-between">
                  <span>📈 近7天掌握词汇增长趋势</span>
                  <span class="text-xs text-slate-400">稳步上升，无断崖式遗忘</span>
                </div>
                {/* Bar chart mockup */}
                <div class="flex items-end justify-between h-36 pt-4 px-2 border-b border-slate-800">
                  {state.historyGrowth.map((item, idx) => (
                    <div key={idx} class="flex flex-col items-center flex-1">
                      <div class="text-[11px] font-black text-sky-400 mb-1">{item.words}词</div>
                      <div 
                        class="w-8 rounded-t-lg bg-gradient-to-t from-sky-600 to-sky-400 transition-all"
                        style={{ height: `${item.words * 2.2}px` }}
                      ></div>
                      <div class="text-xs text-slate-400 font-bold mt-2">{item.day}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Spelling Top Error Words Diagnostic */}
              <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <div class="text-base font-black text-rose-300 mb-3 flex items-center justify-between">
                  <span>⚠️ 拼写错误热词 TOP 5 (错位精细定位)</span>
                  <span class="text-xs text-slate-400">键盘实体输入数据汇总</span>
                </div>
                <div class="space-y-2.5">
                  {errorWordsList.slice(0, 5).map((w, idx) => (
                    <div key={idx} class="flex items-center justify-between bg-slate-800/80 p-3 rounded-xl border border-slate-700/50">
                      <div>
                        <span class="font-mono font-black text-lg text-amber-300 mr-2">{w.word}</span>
                        <span class="text-xs text-slate-400">({w.meaning})</span>
                        <div class="text-[11px] text-rose-400 mt-0.5">
                          易错字母: {Object.keys(w.errorLetters).length > 0 
                            ? Object.entries(w.errorLetters).map(([l, cnt]) => `[${l}错${cnt}次]`).join(' ') 
                            : '暂无'}
                        </div>
                      </div>
                      <div class="text-right">
                        <span class="text-xs bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded-full font-black">
                          共拼错 {w.errorCount} 次
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Right: Grammar Diagnosis & Spaced Repetition Queue */}
            <div class="space-y-6">
              
              {/* Grammar Points Breakdown */}
              <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <div class="text-base font-black text-purple-300 mb-3">
                  🎯 语法薄弱点深度剖析
                </div>
                <div class="space-y-4">
                  {curriculum.grammarPoints.map(gp => {
                    const prog = state.grammarProgress[gp.id] || { attempted: 1, correct: 1 };
                    const rate = Math.round((prog.correct / prog.attempted) * 100);
                    return (
                      <div key={gp.id} class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
                        <div class="flex justify-between items-center mb-2">
                          <span class="font-extrabold text-sm text-slate-200">{gp.title}</span>
                          <span class={`font-black text-sm ${rate >= 80 ? 'text-emerald-400' : 'text-amber-400'}`}>
                            正确率 {rate}% ({prog.correct}/{prog.attempted})
                          </span>
                        </div>
                        <div class="w-full h-3 bg-slate-700 rounded-full overflow-hidden">
                          <div 
                            class={`h-full rounded-full ${rate >= 80 ? 'bg-emerald-500' : 'bg-amber-500'}`}
                            style={{ width: `${rate}%` }}
                          ></div>
                        </div>
                        <div class="text-xs text-slate-400 mt-2">
                          💡 辅导建议：{rate >= 80 ? '掌握牢固，建议鼓励孩子尝试在写话中主动造句。' : '对三单变形易忽略尾巴(s/es)，可通过口诀再强化。'}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Spaced Review Queue Card */}
              <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <div class="text-base font-black text-amber-300 mb-3 flex items-center justify-between">
                  <span>⏰ 艾宾浩斯间隔复习队列</span>
                  <span class="text-xs text-slate-400">1天 / 3天 / 7天 / 15天周期</span>
                </div>
                <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                  {curriculum.words.map(w => {
                    const prog = state.wordsProgress[w.id];
                    const isDue = prog && prog.nextReviewAt <= Date.now();
                    return (
                      <div key={w.id} class="flex items-center justify-between p-2.5 rounded-lg bg-slate-800/60 border border-slate-700 text-xs">
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-slate-200">{w.word}</span>
                          <span class="text-slate-500">{w.meaning}</span>
                        </div>
                        <div>
                          {isDue ? (
                            <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-black">
                              今日需复习 🚨
                            </span>
                          ) : (
                            <span class="text-slate-400">
                              下期复习: {prog?.reviewInterval || 1}天后
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>

          </div>
        </div>
      );
    };

    // =========================================================================
    // ROOT APP ROUTER & ORCHESTRATOR
    // =========================================================================
    const App = () => {
      const { state, recordWordError, recordWordMastered, recordGrammarAnswer, unlockNextNode } = useStudentStore();
      
      const [currentView, setCurrentView] = useState('map'); // 'map' | 'learning' | 'spelling' | 'grammar' | 'boss' | 'parent'
      const [showSettlement, setShowSettlement] = useState(false);
      const [activeNodeId, setActiveNodeId] = useState(null);

      const handleSelectNode = (nodeId) => {
        setActiveNodeId(nodeId);
        soundEngine.play('pop');
        if (nodeId === 'node_1') setCurrentView('learning');
        if (nodeId === 'node_2') setCurrentView('spelling');
        if (nodeId === 'node_3') setCurrentView('grammar');
        if (nodeId === 'node_4') setCurrentView('boss');
      };

      const handleLevelFinished = () => {
        if (activeNodeId) {
          unlockNextNode(activeNodeId, 3);
        }
        setShowSettlement(true);
      };

      return (
        <div class="w-full h-full flex flex-col relative select-none">
          {/* Persistent Top Navigation Bar */}
          <AppHeader 
            state={state} 
            currentTab={currentView}
            setTab={(tab) => setCurrentView(tab)}
            onBackToMap={() => setCurrentView('map')}
          />

          {/* Dynamic Screen Routing */}
          <main class="flex-1 w-full h-[calc(1024px-4rem)] relative overflow-hidden" data-stitch-vh="h-[calc(1024px-4rem)]===h-[calc(100vh-4rem)]">
            {currentView === 'map' && (
              <MapView 
                state={state} 
                onSelectNode={handleSelectNode} 
              />
            )}

            {currentView === 'learning' && (
              <WordLearningView 
                words={CURRICULUM_DATA.words}
                onComplete={handleLevelFinished}
                recordMastery={recordWordMastered}
              />
            )}

            {currentView === 'spelling' && (
              <div class="h-[calc(1024px-4rem)] p-8 bg-slate-900 flex flex-col items-center justify-center" data-stitch-vh="h-[calc(1024px-4rem)]===h-[calc(100vh-4rem)]">
                <div class="w-full max-w-2xl">
                  <SpellingLevelComponent 
                    wordObj={CURRICULUM_DATA.words[1]} // Practice 'weekend'
                    onFinished={handleLevelFinished}
                  />
                </div>
              </div>
            )}

            {currentView === 'grammar' && (
              <GrammarView 
                grammarPoints={CURRICULUM_DATA.grammarPoints}
                onComplete={handleLevelFinished}
                recordGrammar={recordGrammarAnswer}
              />
            )}

            {currentView === 'boss' && (
              <BossBattleView 
                words={CURRICULUM_DATA.words}
                onVictory={handleLevelFinished}
                recordMastery={recordWordMastered}
              />
            )}

            {currentView === 'parent' && (
              <ParentDashboardView 
                state={state} 
                curriculum={CURRICULUM_DATA}
                onBack={() => setCurrentView('map')}
              />
            )}
          </main>

          {/* Victory & Star Modal Overlay */}
          {showSettlement && (
            <SettlementModal 
              starsEarned={3}
              onReturnMap={() => {
                setShowSettlement(false);
                setCurrentView('map');
              }}
              onNextLevel={() => {
                setShowSettlement(false);
                if (activeNodeId === 'node_1') setCurrentView('spelling');
                else if (activeNodeId === 'node_2') setCurrentView('grammar');
                else if (activeNodeId === 'node_3') setCurrentView('boss');
                else setCurrentView('map');
              }}
            />
          )}
        </div>
      );
    };

const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>

</body></html>
